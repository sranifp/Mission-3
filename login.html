<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chill - Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="auth-wrapper">
        <div class="auth-container">
            <div class="logo-container">
                <div class="clapperboard">
                    <div class="clapper-top">
                        <svg viewBox="0 0 100 40" fill="white">
                            <path
                                d="M0,30 L15,10 L30,10 L15,30 L35,30 L50,10 L65,10 L50,30 L70,30 L85,10 L100,10 L85,30 Z"
                                opacity="0.2" />
                            <rect x="0" y="25" width="100" height="15" rx="3" />
                        </svg>
                    </div>
                    <div class="clapper-bottom">
                        <svg viewBox="0 0 100 60" fill="white">
                            <rect x="0" y="0" width="100" height="55" rx="5" />
                            <circle cx="50" cy="30" r="8" fill="#0b0c10" />
                        </svg>
                    </div>
                </div>
                <span class="logo-text">CHILL</span>
            </div>


            <form class="auth-form" action="index.html" method="GET">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Masukkan username anda" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Masukkan password anda" required>
                </div>

                <button type="submit" class="btn-primary">Masuk</button>

                <button type="button" class="btn-google">
                    <img src="img/google.jpg" alt="Google" width="18">
                    Masuk dengan Google
                </button>
            </form>

            <div class="auth-links">
                <a href="#">Lupa password?</a>
                <p>Belum punya akun? <a href="register.html">Daftar di sini</a></p>
            </div>
        </div>
    </div>

</body>

</html>
